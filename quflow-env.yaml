name: quflow
channels:
  - conda-forge
dependencies:
  - python
  - pip
  - numpy
  - scipy
  - fonttools
  - contourpy
  - numba
  - h5py
  - appdirs
  - pytest
  - ffmpeg
  - matplotlib
  - cartopy
  - jupyter
  - ipywidgets
  - tqdm
  - prettytable
  - fftw
  - ducc0
  - libblas=*=*_newaccelerate # [arm64 and osx]
  - libblas=*=*mkl # [x86_64]
